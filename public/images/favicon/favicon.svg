  <!-- Отверстия диска -->
  <circle cx="256" cy="180" r="18" fill="#7f8c8d"/>
  <circle cx="256" cy="332" r="18" fill="#7f8c8d"/>
  <circle cx="180" cy="256" r="18" fill="#7f8c8d"/>
  <circle cx="332" cy="256" r="18" fill="#7f8c8d"/>
  <circle cx="202" cy="202" r="18" fill="#7f8c8d"/>
  <circle cx="310" cy="310" r="18" fill="#7f8c8d"/>
  <circle cx="310" cy="202" r="18" fill="#7f8c8d"/>
  <circle cx="202" cy="310" r="18" fill="#7f8c8d"/>
  
  <!-- Центральная гайка -->
  <circle cx="256" cy="256" r="35" fill="#e74c3c" stroke="#c0392b" stroke-width="3"/>
  <circle cx="256" cy="256" r="20" fill="#c0392b"/>
