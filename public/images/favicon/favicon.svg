    <rect x="408" y="248" width="40" height="16" rx="4"/>
    <rect x="120" y="100" width="16" height="40" rx="4" transform="rotate(45 128 120)"/>
    <rect x="376" y="372" width="16" height="40" rx="4" transform="rotate(45 384 392)"/>
    <rect x="372" y="100" width="16" height="40" rx="4" transform="rotate(-45 380 120)"/>
    <rect x="116" y="372" width="16" height="40" rx="4" transform="rotate(-45 124 392)"/>
