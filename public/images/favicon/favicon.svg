<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Фон круглый -->
  <circle cx="256" cy="256" r="256" fill="#e74c3c"/>
  
  <!-- Внешний обод шины -->
  <circle cx="256" cy="256" r="200" fill="#2c3e50" stroke="#1a252f" stroke-width="8"/>
  
  <!-- Протектор шины (насечки) -->
  <g fill="#3d5266">
    <rect x="248" y="64" width="16" height="40" rx="4"/>
    <rect x="248" y="408" width="16" height="40" rx="4"/>
