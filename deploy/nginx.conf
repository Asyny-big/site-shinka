# Конфигурация Nginx для сайта ydenisa.ru
# Оптимизация кеширования статических файлов для PageSpeed

server {
    listen 80;
    listen [::]:80;
    server_name ydenisa.ru www.ydenisa.ru;
    
    # Перенаправление на HTTPS
    return 301 https://ydenisa.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ydenisa.ru www.ydenisa.ru;

    # SSL-сертификаты (пример для Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ydenisa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ydenisa.ru/privkey.pem;
    
    # Корневая директория сайта
    root /var/www/ydenisa.ru;
    index index.html;

    # Gzip-сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # =============================================
    # КЕШИРОВАНИЕ СТАТИЧЕСКИХ ФАЙЛОВ (30 дней)
    # =============================================

    # Изображения (jpg, jpeg, png, webp, gif, ico, svg)
    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Стили CSS
    location ~* \.css$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Скрипты JS
    location ~* \.js$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Шрифты (woff, woff2, ttf, eot)
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        log_not_found off;
    }

    # Robots.txt и Sitemap
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # =============================================
    # HTML (без долгого кеширования)
    # =============================================
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # =============================================
    # PROXY ДЛЯ BACKEND API (Node.js)
    # =============================================
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Без кеширования для API
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # =============================================
    # ЗАЩИТА СЛУЖЕБНЫХ ФАЙЛОВ
    # =============================================
    
    # Запрет доступа к backend
    location /backend/ {
        deny all;
        return 404;
    }

    # Запрет доступа к node_modules
    location /node_modules/ {
        deny all;
        return 404;
    }

    # Запрет доступа к скрытым файлам (.env, .git, и т.д.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Запрет доступа к JSON-файлам (кроме sitemap)
    location ~* \.json$ {
        deny all;
        return 404;
    }

    # =============================================
    # БЕЗОПАСНОСТЬ
    # =============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Основная локация
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Логи
    access_log /var/log/nginx/ydenisa.ru.access.log;
    error_log /var/log/nginx/ydenisa.ru.error.log;
}
